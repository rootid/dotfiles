onboarding = false
# herdr configuration - only overrides of `herdr --default-config`.
# Linked to ~/.config/herdr/config.toml by `make link_terminal`.
# Validate: herdr config check   Apply: herdr server reload-config

[theme]
# Follow Ghostty's ANSI palette instead of herdr's own theme.
name = "terminal"

[terminal]
new_cwd = "follow"

[ui]
# Agent state must not depend on color alone: Modus Operandi's dark palette
# and the highlighted row made the default dots indistinguishable. Symbols
# give each state (blocked/working/done/idle/unknown) its own glyph.
status_indicators = "symbols"
# Agents needing input (blocked) sort to the top of the agents panel.
agent_panel_sort = "priority"

# Spell the state out next to the glyph ("blocked", "working", ...).
[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "state_text"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "state_text"], ["agent"]]

# macOS notification when an agent in a background workspace finishes or
# needs input, so blocked agents are noticed outside the herdr window.
[ui.toast]
delivery = "system"

[keys]
# Prefix stays ctrl+b so it never collides with tmux (ctrl+n).
# tmux-style splits from ~/.tmux.conf, kept alongside herdr's defaults.
# "|" is listed twice because terminals report it either way.
split_vertical = ["prefix+v", "prefix+|", "prefix+shift+backslash"]
split_horizontal = ["prefix+minus"]
